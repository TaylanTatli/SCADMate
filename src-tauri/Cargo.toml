[package]
name = "scadmate"
version = "0.1.0"
description = "AI-assisted OpenSCAD workspace"
authors = ["SCADmate contributors"]
edition = "2021"

[lib]
name = "scadmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "sync", "time"] }
